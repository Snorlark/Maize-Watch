name: maize_watch
description: "Maize Watch - Smart Corn Farming Management System"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  intl: 0.19.0

  shared_preferences: ^2.5.3
  http: ^1.3.0
  
  icons_flutter: ^0.0.5
  google_fonts: ^6.2.1
  flutter_screenutil: ^5.9.3
  curved_navigation_bar: ^1.0.6
  syncfusion_flutter_charts: ^28.1.35
  flutter_local_notifications: ^16.3.2
  permission_handler: ^12.0.0+1
  url_launcher: ^6.3.1
  sqflite: ^2.4.2
  flutter_dotenv: ^5.2.1
  lottie: ^2.6.0
  twilio_flutter: ^0.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  generate: true
  uses-material-design: true
  assets:
    - lib/l10n/
    - assets/images/
    - assets/fonts/
    - assets/gif/
    - assets/lottie/
    - .env

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/maize_watch_logo.png"
  min_sdk_android: 21
  remove_alpha_ios: false
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/maize_watch_logo.png"
  web:
    generate: true
    image_path: "assets/images/maize_watch_logo.png"
    background_color: "#00000000"
    theme_color: "#00000000"