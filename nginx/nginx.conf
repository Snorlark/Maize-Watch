# ==========================================
# SERVER BLOCK - Main Configuration
# ==========================================
server {
    # Listen on port 10000 (the external port)
    listen 10000;
    
    # Server name (localhost in container)
    server_name localhost;

    # ==========================================
    # HEALTH CHECK ENDPOINT
    # ==========================================
    location /health {
        access_log off;
        return 200 "All services healthy\n";
        add_header Content-Type text/plain;
    }

    # ==========================================
    # BACKEND API ROUTES
    # ==========================================
    location /api/ {
        # Forward to Node.js backend
        proxy_pass http://127.0.0.1:3001/;
        
        # HTTP/1.1 for better performance
        proxy_http_version 1.1;
        
        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        
        # Forward important headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_cache_bypass $http_upgrade;
        
        # Timeout settings
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ==========================================
    # ANALYTICS ROUTES
    # ==========================================
    location /analytics/ {
        # Forward to Python analytics
        proxy_pass http://127.0.0.1:8000/;
        
        # Same settings as backend
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeout settings
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ==========================================
    # HEALTH CHECK ENDPOINTS FOR SERVICES
    # ==========================================
    location /api/health {
        proxy_pass http://127.0.0.1:3001/health;
    }

    location /analytics/health {
        proxy_pass http://127.0.0.1:8000/health;
    }

    # ==========================================
    # DEFAULT / ROOT ROUTE
    # ==========================================
    location / {
        return 200 "Maize-Watch Full-Stack App is running!\nAPI: /api/\nAnalytics: /analytics/\nHealth: /health\n";
        add_header Content-Type text/plain;
    }
}
