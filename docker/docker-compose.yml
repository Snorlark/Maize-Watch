version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: maize-watch-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: maize_watch
    volumes:
      - mongodb_data:/data/db
    networks:
      - maize-watch-network

  redis:
    image: redis:7.2-alpine
    container_name: maize-watch-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - maize-watch-network

volumes:
  mongodb_data:

networks:
  maize-watch-network:
    driver: bridge