services:
  - type: web
    name: maize-watch-backend
    env: node
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    rootDir: backend
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://maize-watch-frontend.onrender.com
      - key: BACKEND_URL
        value: https://maize-watch-backend-uad9.onrender.com
      - key: MOBILE_APP_URL
        value: https://maize-watch-backend-uad9.onrender.com
      - key: MONGO_URI
        value: set-in-render-dashboard
      - key: MONGODB_URI
        value: set-in-render-dashboard
      - key: MONGO_IOT_URI
        value: set-in-render-dashboard
      - key: MONGODB_IOT_URI
        value: set-in-render-dashboard
      - key: MONGO_DB_NAME
        value: maize_watch
      - key: JWT_SECRET
        value: set-in-render-dashboard
      - key: JWT_REFRESH_SECRET
        value: set-in-render-dashboard
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      - key: REDIS_URL
        value: ""
      - key: THINGSPEAK_API_KEY
        value: set-in-render-dashboard
      - key: THINGSPEAK_CHANNEL_ID
        value: "3083651"
      - key: THINGSPEAK_READ_API_KEY
        value: set-in-render-dashboard
      - key: THINGSPEAK_WRITE_API_KEY
        value: set-in-render-dashboard
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USER
        value: set-in-render-dashboard
      - key: EMAIL_PASS
        value: set-in-render-dashboard
      - key: EMAIL_FROM
        value: noreply@maizewatch.com
      - key: TWILIO_ACCOUNT_SID
        value: set-in-render-dashboard
      - key: TWILIO_AUTH_TOKEN
        value: set-in-render-dashboard
      - key: TWILIO_VERIFY_SERVICE_ID
        value: set-in-render-dashboard
      - key: UPLOAD_DIR
        value: uploads
      - key: MAX_FILE_SIZE
        value: "5242880"
      - key: ALLOWED_FILE_TYPES
        value: jpg,jpeg,png,pdf
      - key: RATE_LIMIT_WINDOW_MS
        value: "900000"
      - key: RATE_LIMIT_MAX_REQUESTS
        value: "100"
      - key: BCRYPT_ROUNDS
        value: "12"
      - key: SESSION_SECRET
        value: set-in-render-dashboard
      - key: CORS_ORIGINS
        value: https://maize-watch-frontend.onrender.com,https://maize-watch-admin.onrender.com
      - key: RATE_LIMIT_DISABLE
        value: "true"
      - key: ENABLE_PYTHON_ANALYTICS
        value: "true"
      - key: ANALYTICS_SERVICE_URL
        value: https://maize-watch-analytics.onrender.com
      - key: LOG_LEVEL
        value: info

  - type: web
    name: maize-watch-analytics
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 2 -b 0.0.0.0:$PORT app:app
    rootDir: analytics_v2
    envVars:
      - key: FLASK_ENV
        value: production
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: MONGODB_URI
        value: set-in-render-dashboard
      - key: THINGSPEAK_CHANNEL_ID
        value: "3083651"
      - key: THINGSPEAK_READ_API_KEY
        value: set-in-render-dashboard

  - type: web
    name: maize-watch-frontend
    env: static
    buildCommand: cd frontend/web-src/web-public && npm run build
    staticPublishPath: frontend/web-src/web-public/dist
    rootDir: .
    envVars:
      - key: VITE_API_URL
        value: https://maize-watch-backend-uad9.onrender.com/api

  - type: web
    name: maize-watch-admin
    env: static
    buildCommand: cd frontend/web-src/web-admin && npm run build
    staticPublishPath: frontend/web-src/web-admin/dist
    rootDir: .
    envVars:
      - key: VITE_API_URL
        value: https://maize-watch-backend-uad9.onrender.com/api
